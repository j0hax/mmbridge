name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Check gofmt
        run: |
          if [ "$(gofmt -l .)" ]; then
            echo "gofmt would modify files:"
            gofmt -l .
            exit 1
          fi

      - name: Build
        run: go build ./...